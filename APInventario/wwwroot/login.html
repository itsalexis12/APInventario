<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Control de Inventario</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md bg-white rounded-xl shadow-lg overflow-hidden m-4">
        <!-- Encabezado -->
        <div class="bg-indigo-600 p-6 text-white text-center">
            <h1 class="text-2xl font-bold flex items-center justify-center gap-2">
                <i class="fa-solid fa-boxes-packing"></i>
                Control de Inventario
            </h1>
            <p class="text-indigo-200 text-sm mt-1">Iniciar Sesión</p>
        </div>

        <!-- Formulario -->
        <form id="formLogin" class="p-6 space-y-4">
            <!-- Alerta de error -->
            <div id="errorAlert" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded text-sm">
                <span id="errorMessage"></span>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Usuario o Email</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input type="text" id="username" required
                           class="w-full pl-10 pr-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
                           placeholder="Ingresa tu usuario o email">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="password" required
                           class="w-full pl-10 pr-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
                           placeholder="••••••••">
                </div>
            </div>

            <button type="submit" id="btnLogin"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg shadow transition duration-200 flex items-center justify-center gap-2">
                <span>Ingresar</span>
                <i class="fa-solid fa-right-to-bracket"></i>
            </button>
        </form>

        <div class="bg-gray-50 px-6 py-3 border-t text-center text-xs text-gray-500">
            Neon PostgreSQL API • C# ASP.NET Core
        </div>
    </div>
    <script>
        const LOGIN_API_BASE = window.location.origin;

        // Función auxiliar para redirigir según el rol recibido
        function redireccionarPorRol(rol) {
            const rolNorm = (rol || '').toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();

            if (rolNorm.includes('vendedor') || rolNorm.includes('vend')) {
                window.location.href = 'vendedor.html';
            } else if (rolNorm.includes('almacen')) {
                window.location.href = 'almacenista.html';
            } else {
                window.location.href = 'index.html'; // Administrador
            }
        }

        // 1. Si ya existe una sesión activa en sessionStorage, redirigir automáticamente
        const sesionExistente = sessionStorage.getItem('usuario_sesion');
        if (sesionExistente && sesionExistente !== 'undefined') {
            try {
                const usuario = JSON.parse(sesionExistente);
                if (usuario) {
                    redireccionarPorRol(usuario.rol || usuario.Rol || usuario.role);
                }
            } catch (e) {
                sessionStorage.removeItem('usuario_sesion');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const formLogin = document.getElementById('formLogin');
            if (!formLogin) return;

            formLogin.addEventListener('submit', async (e) => {
                e.preventDefault();

                const usernameInput = /** @type {any} */ (document.getElementById('username'));
                const passwordInput = /** @type {any} */ (document.getElementById('password'));
                const errorAlert = document.getElementById('errorAlert');
                const errorMessage = document.getElementById('errorMessage');
                const btnLogin = /** @type {any} */ (document.getElementById('btnLogin'));

                const username = usernameInput && usernameInput.value ? usernameInput.value.trim() : '';
                const password = passwordInput && passwordInput.value ? passwordInput.value : '';

                if (errorAlert) errorAlert.classList.add('hidden');

                if (btnLogin) {
                    btnLogin.disabled = true;
                    btnLogin.innerHTML = 'Verificando...';
                }

                try {
                    const response = await fetch(`${LOGIN_API_BASE}/auth/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });

                    const data = await response.json();
                    console.log("🔍 Respuesta de la API:", data);

                    if (response.ok) {
                        // Extraer los datos del usuario de forma segura
                        const usuarioObj = data.usuario || data.user || data;

                        if (!usuarioObj) {
                            throw new Error("La respuesta de la API no contiene datos válidos.");
                        }

                        // Guardar en sessionStorage para que expire al cerrar el navegador
                        sessionStorage.setItem('usuario_sesion', JSON.stringify(usuarioObj));

                        // Redirigir al panel correspondiente
                        const rolDetectado = usuarioObj.rol || usuarioObj.Rol || usuarioObj.role || '';
                        redireccionarPorRol(rolDetectado);
                    } else {
                        if (errorMessage) errorMessage.innerText = data.mensaje || data.detail || 'Credenciales incorrectas';
                        if (errorAlert) errorAlert.classList.remove('hidden');
                    }
                } catch (err) {
                    console.error("❌ Error en el inicio de sesión:", err);
                    if (errorMessage) errorMessage.innerText = err.message || 'No se pudo conectar con la API';
                    if (errorAlert) errorAlert.classList.remove('hidden');
                } finally {
                    if (btnLogin) {
                        btnLogin.disabled = false;
                        btnLogin.innerHTML = '<span>Ingresar</span> <i class="fa-solid fa-right-to-bracket"></i>';
                    }
                }
            });
        });
    </script>
</body>
</html>
